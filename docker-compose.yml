services:
  # Base de datos MySQL
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # Volumen: aquí se guardan los datos aunque se apaguen los contenedores
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - red-interna

  # Backend: Django + Django REST Framework
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-interna

  # Frontend: React + Vite
  frontend:
    build: ./frontend
    environment:
      VITE_BASE_API_URL: http://localhost:8000
      VITE_LOCAL_STORAGE_ITEM_NAME: TOKEN
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - red-interna

volumes:
  mysql-data:

networks:
  red-interna:
    driver: bridge
